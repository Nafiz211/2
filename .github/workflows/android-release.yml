name: Android Debug APK Build and Public Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(which sdkmanager 2>/dev/null || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")
          echo "Using sdkmanager at: $SDKMANAGER"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          fi

      - name: Install required Android SDK components
        run: |
          SDKMANAGER=$(which sdkmanager 2>/dev/null || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")
          echo "Installing required platforms and build tools via sdkmanager..."
          if [ -x "$SDKMANAGER" ]; then
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          fi

      - name: Verify Android SDK installation
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          SDKMANAGER=$(which sdkmanager 2>/dev/null || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")
          if [ -x "$SDKMANAGER" ]; then
            echo "Installed SDK components:"
            "$SDKMANAGER" --list_installed | grep -E "platforms;android|build-tools;" || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure debug keystore exists
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already present."
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Decoding debug keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          else
            echo "Generating fresh debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s ./debug.keystore || (echo "Failed to prepare debug.keystore" && exit 1)

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle wrapper
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Locate and verify generated APK
        id: verify_apk
        run: |
          echo "Scanning build outputs directory..."
          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*androidTest*" ! -name "*unaligned*" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK file found in app/build/outputs/apk"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Generated APK at $APK_PATH is empty (0 bytes)"
            exit 1
          fi

          echo "Discovered APK: $APK_PATH"
          echo "APK size: $(stat -c%s "$APK_PATH") bytes"

          mkdir -p build-artifacts
          TARGET_APK="build-artifacts/MediaNotifListener-debug.apk"
          cp "$APK_PATH" "$TARGET_APK"

          echo "apk_path=$TARGET_APK" >> "$GITHUB_OUTPUT"
          echo "apk_filename=MediaNotifListener-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build-artifacts/MediaNotifListener-debug.apk
          if-no-files-found: error

  release:
    name: Publish Public GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: release-assets

      - name: Validate release asset
        run: |
          ls -lh release-assets
          APK_FILE="release-assets/MediaNotifListener-debug.apk"
          if [ ! -s "$APK_FILE" ]; then
            echo "::error::Release APK asset missing or empty: $APK_FILE"
            exit 1
          fi

      - name: Create Public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Media Notif Listener Debug Build #${GITHUB_RUN_NUMBER}"
          APK_FILE="release-assets/MediaNotifListener-debug.apk"

          RELEASE_NOTES=$(cat <<EOF
          ## Media Notif Listener (Debug APK)

          This is an automated debug APK build published directly from GitHub Actions.

          - **Build Number**: #${GITHUB_RUN_NUMBER}
          - **Build Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Commit SHA**: \`${GITHUB_SHA}\`
          - **Download**: \`MediaNotifListener-debug.apk\` (see Assets below)

          ### How to Install on Android
          1. Download **MediaNotifListener-debug.apk** directly to your phone.
          2. Open the downloaded file from your notifications or Files app.
          3. When prompted, allow **Install from unknown sources** for your browser/file manager.
          4. Complete installation and open the app.
          EOF
          )

          gh release create "$TAG_NAME" "$APK_FILE" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}")

          echo "### 🚀 Release Published Successfully!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Page**: [$RELEASE_TITLE]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Direct APK Asset**: \`MediaNotifListener-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag**: \`$TAG_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Download the APK directly from the Release Assets section on your phone." >> "$GITHUB_STEP_SUMMARY"
